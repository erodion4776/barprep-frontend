# ── Build Configuration ───────────────────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  # Pin Node version for reproducible builds
  NODE_VERSION = "20"
  NPM_VERSION  = "10"

  # Document required environment variables (values set in Netlify UI)
  # VITE_SUPABASE_URL      = "set in Netlify dashboard"
  # VITE_SUPABASE_ANON_KEY = "set in Netlify dashboard"
  # VITE_BACKEND_URL       = "set in Netlify dashboard"

# ── Context: Production ───────────────────────────────────────────────────────
[context.production]
  command = "npm run build"

# ── Context: Deploy Previews (PRs) ────────────────────────────────────────────
[context.deploy-preview]
  command = "npm run build"

# ── Context: Branch deploys ───────────────────────────────────────────────────
[context.branch-deploy]
  command = "npm run build"

# ── SPA Redirect ─────────────────────────────────────────────────────────────
# React Router requires all routes to serve index.html
# Status 200 = rewrite (not redirect) — URL stays the same in browser
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security Headers ──────────────────────────────────────────────────────────
# Applied to all pages
[[headers]]
  for = "/*"

  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"

    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"

    # Control referrer info sent to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS for 1 year (enable after confirming HTTPS works)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Disable browser features we don't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Content Security Policy
    # Allows: self, Supabase, YouTube embeds, Google Fonts,
    #         Pollinations AI images, inline styles (Tailwind)
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:
        https://*.supabase.co
        https://image.pollinations.ai
        https://i.ytimg.com
        https://img.youtube.com;
      frame-src https://www.youtube.com https://www.youtube-nocookie.com;
      connect-src 'self'
        https://*.supabase.co
        wss://*.supabase.co
        https://image.pollinations.ai
        https://text.pollinations.ai;
      media-src 'self' https://*.supabase.co;
      worker-src 'self' blob:;
      manifest-src 'self';
    """

# ── Cache Headers for Static Assets ──────────────────────────────────────────
# Vite adds content hashes to JS/CSS filenames
# Safe to cache for 1 year — hash changes when content changes

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Short cache for HTML ──────────────────────────────────────────────────────
# index.html should NOT be cached long — it's the app shell
# Browser must re-check for updated JS/CSS references

[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── No cache for manifests and service workers ────────────────────────────────
[[headers]]
  for = "/site.webmanifest"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Image cache ───────────────────────────────────────────────────────────────
[[headers]]
  for = "*.png"

  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.svg"

  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.ico"

  [headers.values]
    Cache-Control = "public, max-age=86400"
